# File: config.yaml

environment:
  logging:
    level: info
  paths:
    wal: wal.jsonl
  timescaledb:
    host: localhost
    port: 5432
    ssl_mode: verify-ca
    db: finance
    max_batch_size: 1000
    max_batch_age_seconds: 2.0

business:
  providers:
    yahoo:
      timeout: 10s
      sweep: 
        default: 
          window: 2h
          cadence: 30m
        1d: 
          window: 1w
          cadence: 1d
      constraints:
        history_limits:
          default: 1w
          5m: 60d
          1h: 730d
          1d: null
    
    ecb:
      timeout: 20s
      timezone: Europe/Berlin
      overlap:
        default:
          window: 0
      constraints: {}

    fred:
      timeout: 10s
      timezone: America/Chicago
      sweep: 
        default: 
          window: 30d
          cadence: 1w
      constraints: 
        rate_limit:
          # not used as way beyond usage, just capturing 
          requests_per_minute: 120

  series_templates:

    daily:
      interval: 1d
      # default puplication_offset is same as interval
      # for >=1d, default retention is long lived, bootstrap_history 10y
      # long lived means stored in table without retention policy

    intraday:
      interval: 5m
      # for <1d, default retention is short lived, bootstrap_history 30d
      # short lived means stored in table with retention policy

    candle: {}
      # default series_type is candle

    value:
      series_type: value
      # values are usually published entities like the daily EUR/USR rate of ECB or FRED interest rates.
      # So, we don't need to wait for the next day to fetch them.

    # Calendar templates. 
    # Default: week_start=mon, week_end=fri, timezone UTC, market open min, market_close max (i.e. 24x5)

    24x7:
      week_start: sun
      week_end: sat

    24x5: {}
      # defaults are correct

    eu_equities:
      timezone: Europe/Amsterdam
      # if used without quotes, yaml converts this to a sexagesimal number.
      # As that is ambiguous betweeh hh:mm:ss (hour*3600+minutes*60+seconds) 
      # and hh:mm (hours*60+minutes), only hh:mm is supported here,
      # since for open and close times, seconds are not likely to be needed.
      # if you need hh:mm:ss nonetheless, put it in quotes: "09:30:25"
      market_open: 09:00
      market_close: 17:30

    us_equities:
      timezone: America/New_York
      market_open: 09:30
      market_close: 16:00

    cboe_equities:
      timezone: America/Chicago
      market_open: 08:30
      market_close: 15:00

    cme_futures:
      timezone: America/Chicago
      market_open: 17:00
      market_close: 16:00  # next day, with daily maintenance break

    us_treasury:
      timezone: America/New_York

    ecb:
      timezone: Europe/Berlin
      publication_offset: 16h
      market_open: 15:55
      market_close: 16:05

  assets:

    # -------------------------
    # FOREX: EURUSD (Yahoo)
    # -------------------------
    eurusd_yahoo:
      provider: 
        name: yahoo
        code: EURUSD=X
      symbol: EURUSD
      tags:
        instrument: forex
        exchange: FOREX
        region: GLOBAL
        currency: USD
        unit: ratio
      series:
        daily: [daily, 24x5]

    # -------------------------
    # FOREX: EURUSD (ECB)
    # -------------------------
    eurusd_ecb:
      provider:
        name: ecb
        code: USD_EUR
      symbol: EURUSD
      tags:
        instrument: forex
        exchange: FOREX
        region: EU
        currency: USD
        unit: ratio
      series:
        daily: [daily, value, ecb]

    # -------------------------
    # COMMODITIES
    # -------------------------
    gold:
      provider:
        name: yahoo
        code: GC=F
      symbol: GOLD
      tags:
        instrument: commodity
        exchange: COMMODITY
        region: GLOBAL
        currency: USD
        unit: 100_troy_ounce
      series:
        intraday: [intraday, 24x7]
        daily: [daily, 24x7]

    wti:
      provider:
        name: yahoo
        code: CL=F
      symbol: WTI
      tags:
        instrument: commodity
        exchange: COMMODITY
        region: GLOBAL
        currency: USD
        unit: barrel
      series:
        intraday: [intraday, 24x7]
        daily: [daily, 24x7]

    brent:
      provider:
        name: yahoo
        code: BZ=F
      symbol: BRENT
      tags:
        instrument: commodity
        exchange: COMMODITY
        region: GLOBAL
        currency: USD
        unit: barrel
      series:
        intraday: [intraday, 24x7]
        daily: [daily, 24x7]

    # -------------------------
    # EQUITIES
    # -------------------------
    shell:
      symbol: SHEL
      provider:
        name: yahoo
        code: SHEL
      tags:
        instrument: equity
        exchange: NYSE
        region: GLOBAL
        currency: USD
        unit: share
      series:
        intraday: [intraday, us_equities]
        daily: [daily, us_equities]

    shell_as:
      provider:
        name: yahoo
        code: SHELL.AS
      symbol: SHELL.AS
      tags:
        instrument: equity
        exchange: EURONEXT
        region: GLOBAL
        currency: EUR
        unit: share
      series:
        intraday: [intraday, eu_equities]
        daily: [daily, eu_equities]

    # -------------------------
    # INDEXES
    # -------------------------
    spx:
      provider:
        name: yahoo
        code: ^GSPC
      symbol: SPX
      tags:
        instrument: index
        exchange: NYSE
        region: US
        currency: USD
        unit: index_point
      series:
        daily: [daily, us_equities]

    vix:
      provider:
        name: yahoo
        code: ^VIX
      symbol: VIX
      tags:
        instrument: index
        exchange: CBOE
        region: US
        currency: USD
        unit: index_point
      series:
        daily: [daily, cboe_equities]

    # -------------------------
    # CRYPTO
    # -------------------------
    bitcoin:
      provider:
        name: yahoo
        code: "BTC-USD"
      symbol: BTCUSD
      tags:
        instrument: crypto
        exchange: CRYPTO
        region: GLOBAL
        currency: USD
        unit: coin
      series:
        intraday: [intraday, 24x7]
        daily: [daily, 24x7]

    # -------------------------
    # MACRO (FRED + Treasury)
    # -------------------------
    fred_10y_nominal:
      provider: 
        name: fred
        code: DGS10
      symbol: 10Y_NOMINAL
      tags:
        instrument: macro
        region: US
        unit: percent
      series:
        daily: [daily, value]

    fred_10y_breakeven:
      provider:
        name: fred
        code: T10YIE
      symbol: 10Y_BREAKEVEN
      tags:
        instrument: macro
        region: US
        unit: percent
      series:
        daily: [daily, value, us_treasury]

    fed_balance_sheet:
      provider:
        name: fred
        code: WALCL
      symbol: BALANCE_SHEET
      tags:
        instrument: macro
        region: US
        unit: billions_usd
      series:
        daily: [daily, value, us_treasury]

   # treasury_avg:
   #   provider: treasury
   #   provider_code: avg_interest_rate
   #   symbol: AVG_INTEREST_RATE
   #   tags:
   #     instrument: macro
   #     region: US
   #     unit: percent
   #     provider: treasury
   #   series:
   #     daily:
   #       interval: 1d

  # -------------------------
  # COMPOSITES
  # note: disabled in V1
  # -------------------------
  composites:
    10Y_REAL:
      expression: "fred_10y_nominal - fred_10y_breakeven"
      symbol: 10Y_REAL
      series: daily
      tags:
        instrument: macro
        region: US
        unit: percent

    GOLD_DAILY_RANGE:
      expression: "gold.high - gold.low"
      symbol: GOLD_DAILY_RANGE
      series: daily
      tags:
        instrument: commodity
        region: GLOBAL
        unit: USD
