# File: ops/config.yaml

environment:
  logging:
    level: info
  paths:
    wal: wal.jsonl
  timescaledb:
    host: localhost
    port: 5433
    ssl_mode: verify-full
    db: test
    max_batch_size: 1000
    max_batch_age_seconds: 2.0

business:
  providers:
    yahoo:
      timeout: 10s
      sweep:
        default:
          window: 2h
          cadence: 30m
        1d:
          window: 1w
          cadence: 1d
      constraints:
        history_limits:
          default: 1w
          5m: 60d
          1h: 730d
          1d: null

  templates:
    daily:
      interval: 1d

  assets:
    eurusd_yahoo:
      provider:
        name: yahoo
        code: EURUSD=X
      symbol: EURUSD
      geo_exposure: WORLD
      unit: EUR
      series:
        daily: daily
